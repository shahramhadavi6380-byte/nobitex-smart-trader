name: Nobitex Technical Analysis

on:
  workflow_dispatch:

jobs:
  analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Calculate Indicators
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse
          import time

          def get_candles(tf):
              now = int(time.time())

              params = urllib.parse.urlencode({
                  "symbol": "BTCIRT",
                  "resolution": str(tf),
                  "from": now - tf * 60 * 350,
                  "to": now - tf * 60,
                  "countback": 300
              })

              url = "https://apiv2.nobitex.ir/market/udf/history?" + params

              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.loads(r.read())

              if data.get("s") != "ok":
                  raise Exception(f"Market data error: {data}")

              candles = []

              for t, h, l, c in zip(
                  data["t"], data["h"], data["l"], data["c"]
              ):
                  if int(t) + tf * 60 <= now:
                      candles.append({
                          "high": float(h),
                          "low": float(l),
                          "close": float(c)
                      })

              if len(candles) < 250:
                  raise Exception(
                      f"Not enough closed candles for {tf}: {len(candles)}"
                  )

              return candles

          def ema(values, period):
              alpha = 2 / (period + 1)
              result = [values[0]]

              for x in values[1:]:
                  result.append(
                      alpha * x + (1-alpha) * result[-1]
                  )

              return result

          def rsi(values, period=14):
              changes = [
                  values[i] - values[i-1]
                  for i in range(1, len(values))
              ]

              gains = [max(x, 0) for x in changes]
              losses = [max(-x, 0) for x in changes]

              avg_gain = sum(gains[:period]) / period
              avg_loss = sum(losses[:period]) / period

              for i in range(period, len(gains)):
                  avg_gain = (
                      avg_gain * (period-1) + gains[i]
                  ) / period

                  avg_loss = (
                      avg_loss * (period-1) + losses[i]
                  ) / period

              if avg_loss == 0:
                  return 100 if avg_gain > 0 else 50

              return 100 - 100 / (
                  1 + avg_gain / avg_loss
              )

          def midpoint(highs, lows, period):
              return (
                  max(highs[-period:]) +
                  min(lows[-period:])
              ) / 2

          def analyze(tf, name):

              candles = get_candles(tf)

              close = [x["close"] for x in candles]
              high = [x["high"] for x in candles]
              low = [x["low"] for x in candles]

              ema20 = ema(close, 20)
              ema50 = ema(close, 50)
              ema200 = ema(close, 200)

              # RSI
              current_rsi = rsi(close)

              # MACD
              fast = ema(close, 12)
              slow = ema(close, 26)

              macd = [
                  a-b for a,b in zip(fast,slow)
              ]

              signal = ema(macd, 9)

              # Ichimoku
              tenkan = midpoint(high, low, 9)
              kijun = midpoint(high, low, 26)

              span_a = (tenkan + kijun) / 2
              span_b = midpoint(high, low, 52)

              # Cloud aligned with current candle
              cloud_a = (
                  ema(high, 1)[-27] + ema(low, 1)[-27]
              ) / 2

              old_high = high[:-26]
              old_low = low[:-26]

              cloud_b = (
                  max(old_high[-52:]) +
                  min(old_low[-52:])
              ) / 2

              price = close[-1]

              cloud_top = max(cloud_a, cloud_b)
              cloud_bottom = min(cloud_a, cloud_b)

              if price > cloud_top:
                  cloud_status = "Above Cloud - Bullish"
              elif price < cloud_bottom:
                  cloud_status = "Below Cloud - Bearish"
              else:
                  cloud_status = "Inside Cloud - Neutral"

              trend = (
                  "Bullish" if ema20[-1] > ema50[-1]
                  else "Bearish"
              )

              long_trend = (
                  "Bullish" if price > ema200[-1]
                  else "Bearish"
              )

              macd_status = (
                  "Positive" if macd[-1] > signal[-1]
                  else "Negative"
              )

              return f"""
          TIMEFRAME: {name}

          Price: {price:,.0f} Rial

          RSI: {current_rsi:.2f}

          EMA20: {ema20[-1]:,.0f}
          EMA50: {ema50[-1]:,.0f}
          EMA200: {ema200[-1]:,.0f}

          Short Trend: {trend}
          Long Trend: {long_trend}

          MACD: {macd[-1]:.2f}
          MACD Signal: {signal[-1]:.2f}
          Momentum: {macd_status}

          Ichimoku:
          Tenkan: {tenkan:,.0f}
          Kijun: {kijun:,.0f}
          Cloud Top: {cloud_top:,.0f}
          Cloud Bottom: {cloud_bottom:,.0f}

          Cloud Status: {cloud_status}
          """

          results = [
              "BITCOIN ADVANCED TECHNICAL ANALYSIS"
          ]

          for tf, name in [
              (15, "15 MIN"),
              (60, "1 HOUR"),
              (240, "4 HOURS")
          ]:
              results.append(analyze(tf, name))

          message = "\n".join(results)

          payload = urllib.parse.urlencode({
              "chat_id": os.environ["CHAT_ID"],
              "text": message
          }).encode()

          req = urllib.request.Request(
              "https://api.telegram.org/bot" +
              os.environ["BOT_TOKEN"] +
              "/sendMessage",
              data=payload
          )

          with urllib.request.urlopen(req, timeout=30) as r:
              result = json.loads(r.read())

          if not result.get("ok"):
              raise Exception("Telegram delivery failed")

          print(message)
          print("Analysis completed successfully")

          PY
