name: Nobitex Market Test

on:
  workflow_dispatch:

jobs:
  market-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get Bitcoin Price
        id: price
        run: |
          RESPONSE=$(curl -fsS \
          "https://apiv2.nobitex.ir/market/stats?srcCurrency=btc&dstCurrency=rls")

          PRICE=$(echo "$RESPONSE" | jq -r '.stats["btc-rls"].latest')

          if [ -z "$PRICE" ] || [ "$PRICE" = "null" ]; then
            echo "Price not found"
            exit 1
          fi

          echo "BTC_PRICE=$PRICE" >> "$GITHUB_ENV"

      - name: Send to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          curl -fsS -X POST \
          "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
          -d chat_id="${CHAT_ID}" \
          --data-urlencode "text=Bitcoin price in Rials: ${BTC_PRICE}"
