name: Nobitex All Markets Smart Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: pip install requests pandas numpy

      - name: Scan markets and send Telegram report
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          cat > scanner.py <<'PY'
          import os
          import time
          import math
          import requests
          import numpy as np
          import pandas as pd
          from datetime import datetime, timezone

          BASE = "https://apiv2.nobitex.ir"
          BOT_TOKEN = os.environ["BOT_TOKEN"]
          CHAT_ID = os.environ["CHAT_ID"]

          HEADERS = {
              "User-Agent": "TraderBot/NobitexSmartScanner-1.0",
              "Accept": "application/json"
          }

          SESSION = requests.Session()
          SESSION.headers.update(HEADERS)

          # تنظیمات
          SCREEN_LIMIT = 10
          FINAL_REPORT_LIMIT = 10
          TIMEFRAMES = [15, 60, 240]
          CANDLE_COUNT = 350

          def number(x, default=0):
              try:
                  v = float(x)
                  return v if math.isfinite(v) else default
              except:
                  return default

          def fmt(x):
              if x is None or not math.isfinite(float(x)):
                  return "نامشخص"
              x = float(x)
              if abs(x) >= 1000:
                  return f"{x:,.0f}"
              if abs(x) >= 1:
                  return f"{x:,.4f}"
              return f"{x:.8f}"

          def get_json(url, params=None, attempts=4):
              for attempt in range(attempts):
                  try:
                      r = SESSION.get(
                          url,
                          params=params,
                          timeout=25
                      )

                      if r.status_code == 429:
                          wait = min(15, 3 * (attempt + 1))
                          print(f"Rate limit: waiting {wait}s")
                          time.sleep(wait)
                          continue

                      r.raise_for_status()
                      data = r.json()

                      if isinstance(data, dict):
                          if data.get("status") == "failed":
                              time.sleep(2 * (attempt + 1))
                              continue

                      return data

                  except Exception as e:
                      print("Request error:", e)
                      time.sleep(2 * (attempt + 1))

              return None

          def get_all_markets():
              data = get_json(BASE + "/market/stats")

              if not data or not isinstance(data.get("stats"), dict):
                  raise RuntimeError("دریافت فهرست بازارهای نوبیتکس ناموفق بود")

              markets = []

              for key, item in data["stats"].items():
                  if not isinstance(item, dict):
                      continue

                  parts = key.lower().split("-")
                  if len(parts) != 2:
                      continue

                  src, dst = parts

                  if dst not in ("rls", "usdt"):
                      continue

                  closed = item.get("isClosed", False)
                  if str(closed).lower() == "true":
                      continue

                  symbol = src.upper() + (
                      "IRT" if dst == "rls" else "USDT"
                  )

                  price = number(item.get("latest"))
                  volume = number(item.get("volumeDst"))

                  if price <= 0:
                      continue

                  markets.append({
                      "symbol": symbol,
                      "base": src.upper(),
                      "quote": dst,
                      "price": price,
                      "volume": volume,
                      "change": number(item.get("dayChange"))
                  })

              # حذف نمادهای تکراری
              unique = {}
              for m in markets:
                  unique[m["symbol"]] = m

              markets = list(unique.values())

              if not markets:
                  raise RuntimeError("هیچ بازار فعالی پیدا نشد")

              return markets

          def get_candles(symbol, resolution):
              now = int(time.time())

              params = {
                  "symbol": symbol,
                  "resolution": str(resolution),
                  "to": now,
                  "countback": CANDLE_COUNT
              }

              data = get_json(
                  BASE + "/market/udf/history",
                  params=params
              )

              if not data or data.get("s") != "ok":
                  return None

              try:
                  df = pd.DataFrame({
                      "time": data["t"],
                      "open": data["o"],
                      "high": data["h"],
                      "low": data["l"],
                      "close": data["c"],
                      "volume": data.get("v", [0] * len(data["t"]))
                  })

                  for col in ["open", "high", "low", "close", "volume"]:
                      df[col] = pd.to_numeric(df[col], errors="coerce")

                  df["time"] = pd.to_numeric(df["time"], errors="coerce")
                  df = df.dropna()
                  df = df.sort_values("time")
                  df = df.drop_duplicates(subset=["time"])

                  # حذف کندل در حال تشکیل
                  seconds = resolution * 60
                  df = df[df["time"] + seconds <= now]

                  if len(df) < 220:
                      return None

                  return df.reset_index(drop=True)

              except Exception as e:
                  print("Candle parsing error:", symbol, e)
                  return None

          def calculate_indicators(df):
              d = df.copy()

              c = d["close"]
              h = d["high"]
              l = d["low"]
              v = d["volume"]

              # EMA
              d["ema20"] = c.ewm(span=20, adjust=False).mean()
              d["ema50"] = c.ewm(span=50, adjust=False).mean()
              d["ema200"] = c.ewm(span=200, adjust=False).mean()

              # RSI
              delta = c.diff()
              gain = delta.clip(lower=0)
              loss = -delta.clip(upper=0)

              avg_gain = gain.ewm(
                  alpha=1/14,
                  adjust=False,
                  min_periods=14
              ).mean()

              avg_loss = loss.ewm(
                  alpha=1/14,
                  adjust=False,
                  min_periods=14
              ).mean()

              rs = avg_gain / avg_loss.replace(0, np.nan)
              d["rsi"] = 100 - (100 / (1 + rs))
              d.loc[(avg_loss == 0) & (avg_gain > 0), "rsi"] = 100

              # MACD
              ema12 = c.ewm(span=12, adjust=False).mean()
              ema26 = c.ewm(span=26, adjust=False).mean()

              d["macd"] = ema12 - ema26
              d["macd_signal"] = d["macd"].ewm(
                  span=9,
                  adjust=False
              ).mean()

              # ATR و ADX
              prev_close = c.shift(1)

              tr = pd.concat([
                  h - l,
                  (h - prev_close).abs(),
                  (l - prev_close).abs()
              ], axis=1).max(axis=1)

              up_move = h.diff()
              down_move = -l.diff()

              plus_dm = pd.Series(
                  np.where(
                      (up_move > down_move) & (up_move > 0),
                      up_move,
                      0
                  ),
                  index=d.index
              )

              minus_dm = pd.Series(
                  np.where(
                      (down_move > up_move) & (down_move > 0),
                      down_move,
                      0
                  ),
                  index=d.index
              )

              atr = tr.ewm(
                  alpha=1/14,
                  adjust=False,
                  min_periods=14
              ).mean()

              plus_sm = plus_dm.ewm(
                  alpha=1/14,
                  adjust=False,
                  min_periods=14
              ).mean()

              minus_sm = minus_dm.ewm(
                  alpha=1/14,
                  adjust=False,
                  min_periods=14
              ).mean()

              plus_di = 100 * plus_sm / atr.replace(0, np.nan)
              minus_di = 100 * minus_sm / atr.replace(0, np.nan)

              dx = (
                  100 * (plus_di - minus_di).abs()
                  / (plus_di + minus_di).replace(0, np.nan)
              )

              d["atr"] = atr
              d["plus_di"] = plus_di
              d["minus_di"] = minus_di
              d["adx"] = dx.ewm(
                  alpha=1/14,
                  adjust=False,
                  min_periods=14
              ).mean()

              # Bollinger Bands
              middle = c.rolling(20).mean()
              std = c.rolling(20).std()

              d["bb_mid"] = middle
              d["bb_upper"] = middle + 2 * std
              d["bb_lower"] = middle - 2 * std

              # Ichimoku
              tenkan = (
                  h.rolling(9).max() +
                  l.rolling(9).min()
              ) / 2

              kijun = (
                  h.rolling(26).max() +
                  l.rolling(26).min()
              ) / 2

              span_a = (tenkan + kijun) / 2

              span_b = (
                  h.rolling(52).max() +
                  l.rolling(52).min()
              ) / 2

              d["tenkan"] = tenkan
              d["kijun"] = kijun

              # ابر متناظر با کندل فعلی
              d["cloud_a"] = span_a.shift(26)
              d["cloud_b"] = span_b.shift(26)

              # OBV
              direction = np.sign(c.diff()).fillna(0)
              d["obv"] = (direction * v).cumsum()
              d["obv_ma"] = d["obv"].rolling(20).mean()

              return d

          def find_pivots(df, left=4, right=4):
              highs = df["high"].values
              lows = df["low"].values

              pivots = []

              for i in range(left, len(df) - right):
                  if highs[i] == max(highs[i-left:i+right+1]):
                      pivots.append((i, highs[i], "H"))

                  if lows[i] == min(lows[i-left:i+right+1]):
                      pivots.append((i, lows[i], "L"))

              pivots.sort(key=lambda x: x[0])

              clean = []
              for p in pivots:
                  if clean and clean[-1][2] == p[2]:
                      if p[2] == "H" and p[1] > clean[-1][1]:
                          clean[-1] = p
                      elif p[2] == "L" and p[1] < clean[-1][1]:
                          clean[-1] = p
                  else:
                      clean.append(p)

              return clean

          def fibonacci(df):
              pivots = find_pivots(df)

              if len(pivots) < 2:
                  return None

              a, b = pivots[-2], pivots[-1]

              top = max(a[1], b[1])
              bottom = min(a[1], b[1])
              diff = top - bottom

              if diff <= 0:
                  return None

              return {
                  "0.236": bottom + diff * 0.236,
                  "0.382": bottom + diff * 0.382,
                  "0.500": bottom + diff * 0.500,
                  "0.618": bottom + diff * 0.618,
                  "0.786": bottom + diff * 0.786
              }

          def pitchfork(df):
              pivots = find_pivots(df)

              if len(pivots) < 3:
                  return None

              p1, p2, p3 = pivots[-3:]

              x1, y1, _ = p1
              x2, y2, _ = p2
              x3, y3, _ = p3

              mx = (x2 + x3) / 2
              my = (y2 + y3) / 2

              if mx == x1:
                  return None

              slope = (my - y1) / (mx - x1)
              current_x = len(df) - 1

              median = y1 + slope * (current_x - x1)
              offset = abs(y2 - (y1 + slope * (x2 - x1)))

              upper = median + offset
              lower = median - offset

              return {
                  "median": median,
                  "upper": max(upper, lower),
                  "lower": min(upper, lower)
              }

          def analyze(df):
              d = calculate_indicators(df)
              last = d.iloc[-1]

              fields = [
                  "close", "ema20", "ema50", "ema200",
                  "rsi", "macd", "macd_signal",
                  "adx", "atr", "bb_upper", "bb_mid",
                  "bb_lower", "tenkan", "kijun",
                  "cloud_a", "cloud_b", "obv", "obv_ma",
                  "plus_di", "minus_di"
              ]

              result = {}
              for f in fields:
                  value = number(last[f], float("nan"))
                  result[f] = value

              if not all(math.isfinite(result[x]) for x in [
                  "close", "ema20", "ema50", "ema200",
                  "rsi", "macd", "macd_signal", "atr"
              ]):
                  return None

              result["fib"] = fibonacci(df)
              result["pitchfork"] = pitchfork(df)

              # امتیاز تحلیلی؛ درصد احتمال برد نیست
              score = 50

              if result["close"] > result["ema20"]:
                  score += 7
              else:
                  score -= 7

              if result["ema20"] > result["ema50"]:
                  score += 8
              else:
                  score -= 8

              if result["ema50"] > result["ema200"]:
                  score += 8
              else:
                  score -= 8

              if result["macd"] > result["macd_signal"]:
                  score += 8
              else:
                  score -= 8

              if result["rsi"] >= 55:
                  score += 7
              elif result["rsi"] <= 45:
                  score -= 7

              if result["adx"] >= 25:
                  if result["plus_di"] > result["minus_di"]:
                      score += 5
                  elif result["minus_di"] > result["plus_di"]:
                      score -= 5

              if result["close"] > result["cloud_a"] and \
                 result["close"] > result["cloud_b"]:
                  score += 5

              elif result["close"] < result["cloud_a"] and \
                   result["close"] < result["cloud_b"]:
                  score -= 5

              if result["obv"] > result["obv_ma"]:
                  score += 3
              else:
                  score -= 3

              result["score"] = max(0, min(100, score))

              return result

          def screen_markets(markets):
              print("Screening all markets:", len(markets))

              screened = []

              for i, market in enumerate(markets, 1):
                  symbol = market["symbol"]

                  print(f"Screen {i}/{len(markets)}: {symbol}")

                  df = get_candles(symbol, 60)

                  if df is None:
                      continue

                  result = analyze(df)

                  if result is None:
                      continue

                  market["screen_score"] = result["score"]
                  market["screen_price"] = result["close"]
                  screened.append(market)

                  # رعایت فاصله درخواست‌ها
                  time.sleep(1.1)

              # انتخاب جداگانه برای بازارهای ریالی و تتری
              selected = []

              for quote in ["rls", "usdt"]:
                  group = [
                      m for m in screened
                      if m["quote"] == quote
                  ]

                  group.sort(
                      key=lambda x: x["volume"],
                      reverse=True
                  )

                  selected.extend(group[:SCREEN_LIMIT])

              return selected

          def full_analysis(market):
              symbol = market["symbol"]
              results = {}

              for tf in TIMEFRAMES:
                  print(f"Full analysis {symbol} / {tf}m")

                  df = get_candles(symbol, tf)

                  if df is None:
                      return None

                  result = analyze(df)

                  if result is None:
                      return None

                  results[tf] = result
                  time.sleep(1.1)

              scores = [results[tf]["score"] for tf in TIMEFRAMES]
              average = sum(scores) / len(scores)

              if average >= 65:
                  signal = "BUY"
              elif average <= 35:
                  signal = "SELL"
              else:
                  signal = "NEUTRAL"

              # تأیید جهت در تایم‌فریم‌ها
              if signal == "BUY" and scores.count(1) == 3:
                  signal = "STRONG BUY"

              if signal == "SELL" and scores.count(0) == 3:
                  signal = "STRONG SELL"

              atr = results[240]["atr"]
              price = results[240]["close"]

              if signal in ("BUY", "STRONG BUY"):
                  sl = price - 1.5 * atr
                  tp1 = price + 2 * atr
                  tp2 = price + 3 * atr

              elif signal in ("SELL", "STRONG SELL"):
                  sl = price + 1.5 * atr
                  tp1 = price - 2 * atr
                  tp2 = price - 3 * atr

              else:
                  sl = tp1 = tp2 = None

              return {
                  "symbol": symbol,
                  "quote": market["quote"],
                  "volume": market["volume"],
                  "signal": signal,
                  "score": round(average, 1),
                  "timeframes": results,
                  "sl": sl,
                  "tp1": tp1,
                  "tp2": tp2
              }

          def make_report(items, total_markets):
              now = datetime.now(timezone.utc).strftime(
                  "%Y-%m-%d %H:%M UTC"
              )

              lines = [
                  "📊 گزارش اسکن هوشمند نوبیتکس",
                  f"🕒 {now}",
                  "",
                  f"🔎 بازارهای شناسایی‌شده: {total_markets}",
                  f"📈 بازارهای تحلیل کامل: {len(items)}",
                  "",
                  "━━━━━━━━━━━━━━━━━━"
              ]

              for item in items[:FINAL_REPORT_LIMIT]:
                  symbol = item["symbol"]

                  lines.extend([
                      "",
                      f"💠 {symbol}",
                      f"سیگنال: {item['signal']}",
                      f"امتیاز تحلیلی: {item['score']} از 100",
                      ""
                  ])

                  for tf, label in [
                      (15, "۱۵ دقیقه"),
                      (60, "۱ ساعت"),
                      (240, "۴ ساعت")
                  ]:
                      r = item["timeframes"][tf]

                      lines.append(
                          f"⏱ {label}: امتیاز {r['score']}"
                      )

                      lines.append(
                          f"RSI: {fmt(r['rsi'])} | "
                          f"ADX: {fmt(r['adx'])}"
                      )

                      lines.append(
                          f"EMA20: {fmt(r['ema20'])}"
                      )

                      lines.append(
                          f"MACD: {fmt(r['macd'])}"
                      )

                  lines.extend([
                      "",
                      f"قیمت: {fmt(item['timeframes'][240]['close'])}"
                  ])

                  if item["sl"] is not None:
                      lines.extend([
                          f"حد ضرر محاسباتی: {fmt(item['sl'])}",
                          f"هدف اول: {fmt(item['tp1'])}",
                          f"هدف دوم: {fmt(item['tp2'])}"
                      ])

                  lines.append("━━━━━━━━━━━━━━━━━━")

              lines.extend([
                  "",
                  "⚠️ امتیازها احتمال سود نیستند.",
                  "⚠️ این گزارش توصیه قطعی خرید یا فروش نیست.",
                  "⚠️ قبل از معامله واقعی، بک‌تست و بررسی کارمزد ضروری است."
              ])

              return "\n".join(lines)

          def send_telegram(message):
              url = (
                  f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
              )

              # تقسیم پیام برای محدودیت تلگرام
              chunks = [
                  message[i:i+3800]
                  for i in range(0, len(message), 3800)
              ]

              for chunk in chunks:
                  response = requests.post(
                      url,
                      data={
                          "chat_id": CHAT_ID,
                          "text": chunk
                      },
                      timeout=30
                  )

                  response.raise_for_status()

                  result = response.json()
                  if not result.get("ok"):
                      raise RuntimeError(
                          "Telegram delivery failed: " + str(result)
                      )

                  time.sleep(1)

          def main():
              print("Starting Nobitex scanner...")

              markets = get_all_markets()

              print("Found markets:", len(markets))

              selected = screen_markets(markets)

              print("Selected for full analysis:", len(selected))

              if not selected:
                  send_telegram(
                      "⚠️ اسکن انجام شد اما بازار مناسبی برای تحلیل پیدا نشد."
                  )
                  return

              final_results = []

              for i, market in enumerate(selected, 1):
                  print(
                      f"Full scan {i}/{len(selected)}: "
                      f"{market['symbol']}"
                  )

                  try:
                      result = full_analysis(market)

                      if result:
                          final_results.append(result)

                  except Exception as e:
                      print("Market error:", market["symbol"], e)

              if not final_results:
                  send_telegram(
                      "⚠️ اسکن انجام شد اما تحلیل کامل بازارها ناموفق بود."
                  )
                  return

              final_results.sort(
                  key=lambda x: abs(x["score"] - 50),
                  reverse=True
              )

              report = make_report(
                  final_results,
                  len(markets)
              )

              send_telegram(report)

              print("Scanner completed successfully.")

          if __name__ == "__main__":
              main()
          PY

          python scanner.py
